function findGuide(q) {
  const s = (q || "").trim().toLowerCase();
  if (s.length < 3) return null;
  return EX_GUIDE.find((g) =>
    g.keys.some((k) => s.includes(k)) || g.name.toLowerCase().includes(s)
  ) || null;
}

/* =========================================================
   Камера: реальная съёмка фото и серии кадров.
   Никаких внешних сервисов — только доступ к камере устройства.
   ========================================================= */

function cameraSupported() {
  return typeof navigator !== "undefined" && navigator.mediaDevices && !!navigator.mediaDevices.getUserMedia;
}

/* Прямой доступ к камере браузер даёт только на защищённом соединении.
   Если его нет — открываем штатную камеру телефона через поле выбора файла. */
function secureContext() {
  if (typeof window === "undefined") return false;
  if (window.isSecureContext) return true;
  var h = window.location && window.location.hostname;
  return h === "localhost" || h === "127.0.0.1";
}
function canStream() {
  return cameraSupported() && secureContext();
}

function useCamera(active, facing, onFail) {
  const videoRef = useRef(null);
  const streamRef = useRef(null);

  useEffect(() => {
    let cancelled = false;
    if (!active) return;
    if (!canStream()) { if (onFail) onFail(); return; }

    navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing || "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    }).then((stream) => {
      if (cancelled) { stream.getTracks().forEach((t) => t.stop()); return; }
      streamRef.current = stream;
      if (videoRef.current) {
        videoRef.current.srcObject = stream;
        var pr = videoRef.current.play();
        if (pr && pr.catch) pr.catch(function () {});
      }
    }).catch(function () { if (!cancelled && onFail) onFail(); });

    return () => {
      cancelled = true;
      if (streamRef.current) {
        streamRef.current.getTracks().forEach((t) => t.stop());
        streamRef.current = null;
      }
    };
  }, [active, facing]);

  const grab = () => {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return null;
    const canvas = document.createElement("canvas");
    const scale = Math.min(1, 900 / v.videoWidth);
    canvas.width = Math.round(v.videoWidth * scale);
    canvas.height = Math.round(v.videoHeight * scale);
    canvas.getContext("2d").drawImage(v, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL("image/jpeg", 0.82);
  };

  return { videoRef, grab };
}

/* Достаём кадры из снятого видео — для разбора техники */
function framesFromVideo(file, count) {
  return new Promise(function (resolve) {
    try {
      const url = URL.createObjectURL(file);
      const v = document.createElement("video");
      v.preload = "metadata"; v.muted = true; v.playsInline = true; v.src = url;
      const out = [];
      let times = [], idx = 0;
      const done = function () { try { URL.revokeObjectURL(url); } catch (e) {} resolve(out); };
      v.onloadedmetadata = function () {
        const dur = Math.min(v.duration || 6, 12);
        for (let i = 0; i < count; i++) times.push(dur * (i + 0.5) / count);
        const seek = function () { if (idx >= times.length) return done(); v.currentTime = times[idx]; };
        v.onseeked = function () {
          try {
            const cv = document.createElement("canvas");
            const s = Math.min(1, 540 / (v.videoWidth || 540));
            cv.width = Math.round((v.videoWidth || 540) * s);
            cv.height = Math.round((v.videoHeight || 960) * s);
            cv.getContext("2d").drawImage(v, 0, 0, cv.width, cv.height);
            out.push(cv.toDataURL("image/jpeg", 0.8));
          } catch (e) {}
          idx += 1; seek();
        };
        seek();
      };
      v.onerror = done;
    } catch (e) { resolve([]); }
  });
}

/* ═════════════════════════════════════════════════════════════════════
   CROCUS AI — три агента на Claude
   ─────────────────────────────────────────────────────────────────────
   1. recognizeFood   — считает БЖУ по фото блюда и пишет в дневник
   2. checkTechnique  — разбирает технику упражнения по кадрам
   3. coach           — Степан: знает приложение, профиль и историю
   Адрес прокси задаётся в window.CROCUS_CONFIG в начале файла.
   ═════════════════════════════════════════════════════════════════════ */

const AI_FALLBACK_ENDPOINT = "https://api.anthropic.com/v1/messages";

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} },
};

const AI = Object.assign(
  { endpoint: "", model: "claude-sonnet-4-6", devKey: "" },
  (typeof window !== "undefined" && window.CROCUS_CONFIG) || {},
  LS.get("crocus_ai_cfg", {})
);

function aiSave(patch) {
  Object.assign(AI, patch);
  LS.set("crocus_ai_cfg", { endpoint: AI.endpoint, model: AI.model, devKey: AI.devKey });
}
/* AI считается подключённым, если есть прокси или ключ для отладки */
function aiReady() { return !!(AI.endpoint || AI.devKey); }

/* ---------- один вызов модели ---------- */
async function callClaude(opts) {
  const useProxy = !!AI.endpoint;
  const url = useProxy ? AI.endpoint : AI_FALLBACK_ENDPOINT;
  const headers = { "content-type": "application/json" };
  if (!useProxy && AI.devKey) {
    headers["x-api-key"] = AI.devKey;
    headers["anthropic-version"] = "2023-06-01";
    headers["anthropic-dangerous-direct-browser-access"] = "true";
  }
  const body = {
    model: AI.model || "claude-sonnet-4-6",
    max_tokens: opts.maxTokens || 1400,
    system: opts.system,
    messages: opts.messages,
  };
  if (opts.temperature != null) body.temperature = opts.temperature;

  let res;
  try {
    res = await fetch(url, { method: "POST", headers, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error("Нет связи с AI. Проверьте интернет или адрес прокси в настройках ⚙️.");
  }
  if (!res.ok) {
    let t = ""; try { t = await res.text(); } catch (e) {}
    if (res.status === 401 || res.status === 403) throw new Error("AI отклонил запрос (" + res.status + "). Проверьте ключ на прокси.");
    if (res.status === 429) throw new Error("Много запросов подряд. Подождите несколько секунд.");
    if (res.status === 529 || res.status === 503) throw new Error("Сервис AI перегружен, попробуйте ещё раз.");
    throw new Error("Ошибка AI " + res.status + ". " + String(t).slice(0, 160));
  }
  const data = await res.json();
  const text = (data.content || []).filter((b) => b && b.type === "text").map((b) => b.text).join("\n").trim();
  if (!text) throw new Error("AI вернул пустой ответ.");
  return text;
}

function parseAiJson(text) {
  if (!text) return null;
  let s = String(text).replace(/```json/gi, "").replace(/```/g, "").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  if (a === -1 || b === -1 || b < a) return null;
  s = s.slice(a, b + 1);
  try { return JSON.parse(s); } catch (e) {}
  try { return JSON.parse(s.replace(/,\s*([}\]])/g, "$1")); } catch (e) {}
  return null;
}

const nOr = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };
const uid = () => Math.random().toString(36).slice(2, 10);

/* ---------- фото приводим к безопасному размеру ---------- */
function normalizeImage(dataUrl, maxSide) {
  return new Promise((resolve, reject) => {
    try {
      const img = new Image();
      img.onerror = () => reject(new Error("Не удалось прочитать изображение"));
      img.onload = () => {
        const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        const k = Math.min(1, (maxSide || 1024) / Math.max(w, h));
        const cv = document.createElement("canvas");
        cv.width = Math.max(1, Math.round(w * k));
        cv.height = Math.max(1, Math.round(h * k));
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL("image/jpeg", 0.82));
      };
      img.src = dataUrl;
    } catch (e) { reject(e); }
  });
}
const b64 = (dataUrl) => String(dataUrl).split(",")[1] || "";
const imgBlock = (dataUrl) => ({ type: "image", source: { type: "base64", media_type: "image/jpeg", data: b64(dataUrl) } });

/* ═══════════ норма калорий и БЖУ ═══════════ */
function calcTargets(p) {
  p = p || {};
  const w = Math.min(250, Math.max(35, nOr(p.weight, 70)));
  const h = Math.min(230, Math.max(130, nOr(p.height, 172)));
  const a = Math.min(90, Math.max(14, nOr(p.age, 30)));
  const female = p.gender === "Женский";
  const bmr = 10 * w + 6.25 * h - 5 * a + (female ? -161 : 5);
  const act = { "Малоподвижный": 1.25, "Умеренно активный": 1.4, "Активный": 1.55, "Очень активный": 1.75 };
  const tdee = bmr * (act[p.lifestyle] || 1.4);

  let kcal = tdee;
  if (p.goal === "lose") kcal = tdee * 0.85;
  if (p.goal === "gain") kcal = tdee * 1.12;
  kcal = Math.max(female ? 1300 : 1600, Math.round(kcal / 10) * 10);

  const perKg = p.goal === "gain" ? 1.9 : p.goal === "lose" ? 1.8 : 1.6;
  const pr = Math.round(w * perKg);
  const ft = Math.round((kcal * 0.28) / 9);
  const cb = Math.max(60, Math.round((kcal - pr * 4 - ft * 9) / 4));
  return { kcal: Math.round(kcal), p: pr, f: ft, c: cb, water: Math.round(w * 0.033 * 10) / 10, bmr: Math.round(bmr), tdee: Math.round(tdee) };
}

/* ═══════════ общее состояние приложения ═══════════ */
const CHStore = (function () {
  const saved = LS.get("crocus_state", {});
  const today = new Date().toISOString().slice(0, 10);
  let state = {
    profile: saved.profile || null,
    targets: calcTargets(saved.profile),
    diary: saved.day === today ? (saved.diary || []) : [],
    chat: saved.day === today ? (saved.chat || []) : [],
    water: 1.4,
    day: today,
  };
  const subs = new Set();
  const persist = () => LS.set("crocus_state", { profile: state.profile, diary: state.diary, chat: state.chat.slice(-30), day: state.day });
  const emit = () => { persist(); subs.forEach((f) => { try { f(); } catch (e) {} }); };
  const set = (patch) => { state = Object.assign({}, state, patch); emit(); };

  return {
    get: () => state,
    subscribe(f) { subs.add(f); return () => subs.delete(f); },
    setProfile(p) { set({ profile: p, targets: calcTargets(p) }); },
    seed(list) { if (!state.diary.length) set({ diary: list.map((m) => ({ id: uid(), n: m.name, k: m.kcal, p: m.p || 0, f: m.f || 0, c: m.c || 0, t: m.time, src: "plan" })) }); },
    addDiary(e) {
      set({ diary: state.diary.concat([{
        id: uid(), n: e.n || e.name || "Приём пищи",
        k: Math.round(nOr(e.k != null ? e.k : e.kcal, 0)),
        p: Math.round(nOr(e.p, 0)), f: Math.round(nOr(e.f, 0)), c: Math.round(nOr(e.c, 0)),
        g: Math.round(nOr(e.g, 0)), t: e.t || new Date().toTimeString().slice(0, 5), src: e.src || "photo",
      }]) });
    },
    removeDiary(id) { set({ diary: state.diary.filter((d) => d.id !== id) }); },
    setChat(list) { set({ chat: list }); },
    reset() { LS.del("crocus_state"); set({ profile: null, diary: [], chat: [], targets: calcTargets(null) }); },
  };
})();

function useStore() {
  const [, force] = useState(0);
  useEffect(() => CHStore.subscribe(() => force((n) => n + 1)), []);
  return CHStore.get();
}
function eatenToday(diary) {
  return (diary || []).reduce((s, d) => ({ k: s.k + nOr(d.k, 0), p: s.p + nOr(d.p, 0), f: s.f + nOr(d.f, 0), c: s.c + nOr(d.c, 0) }), { k: 0, p: 0, f: 0, c: 0 });
}

const FOOD_SYSTEM = `Ты — Vision-агент приложения Crocus Health. Определяешь блюдо по фотографии и считаешь его нутриенты.

КАК ОЦЕНИВАТЬ

async function aiRecognizeFood(dataUrl) {

const TECH_SYSTEM = `Ты — тренажёрный эксперт приложения Crocus Health. По серии кадров разбираешь технику выполнения упражнения.

async function aiCheckTechnique(frames, exercise) {
  if (!aiReady()) throw new Error("AI не подключён");
  const list = (frames || []).filter(Boolean).slice(0, 6);
  if (!list.length) throw new Error("Нет кадров для разбора");
  const small = [];
  for (let i = 0; i < list.length; i++) {
    try { small.push(await normalizeImage(list[i], 768)); } catch (e) {}
  }
  if (!small.length) throw new Error("Не удалось подготовить кадры");

  const p = (CHStore.get().profile) || {};
  const content = [];
  small.forEach((f, i) => {
    content.push({ type: "text", text: "Кадр " + (i + 1) + " из " + small.length });
    content.push(imgBlock(f));
  });
  content.push({ type: "text", text: "Разбери технику." + (exercise ? " Упражнение: " + exercise + "." : "")
    + (p.hasIssues && p.issuesText ? " Пользователь отметил особенности здоровья: " + p.issuesText + " — учти это в замечаниях." : "") });

  const text = await callClaude({ system: TECH_SYSTEM, maxTokens: 1200, messages: [{ role: "user", content }] });
  const j = parseAiJson(text);
  if (!j) throw new Error("Не удалось разобрать ответ AI");
  return { good: j.good || [], fix: j.fix || [], summary: j.summary || "", score: j.score, exercise: j.exercise };
}

async function aiCoach(history) {
  if (!aiReady()) throw new Error("AI не подключён");
  const msgs = history.filter((m) => m.text && !m.error).slice(-16)
    .map((m) => ({ role: m.from === "me" ? "user" : "assistant", content: m.raw || m.text }));
  if (!msgs.length || msgs[0].role !== "user") msgs.unshift({ role: "user", content: "Привет" });
  const text = await callClaude({ system: buildCoachSystem(), messages: msgs, maxTokens: 1200, temperature: 0.6 });
  const j = parseAiJson(text);
  if (!j || !j.reply) return { reply: String(text).slice(0, 900), chips: [], goto: null, raw: text };
  j.raw = text;
  return j;
}

function dictate(onText, onEnd) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { onEnd("Браузер не поддерживает голосовой ввод — наберите текст."); return null; }
  const rec = new SR();
  rec.lang = "ru-RU"; rec.interimResults = true; rec.continuous = false;
  let last = "";
  rec.onresult = (e) => { let t = ""; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; last = t; onText(t); };
  rec.onerror = (e) => onEnd(e.error === "not-allowed" ? "Нет доступа к микрофону." : "");
  rec.onend = () => onEnd("", last);
  try { rec.start(); } catch (e) { onEnd(""); return null; }
  return rec;
}

function tasteScore(text, favFoods) {
  if (!favFoods || !favFoods.length) return 0;
  const t = (text || "").toLowerCase();
  let n = 0;
  favFoods.forEach((f) => {
    const words = TASTE_WORDS[f] || [f.toLowerCase()];
    if (words.some((w) => t.includes(w))) n += 1;
  });
  return n;
}

function byTaste(items, favFoods, textOf) {
  if (!favFoods || !favFoods.length) return items;
  return items.slice().sort((a, b) => tasteScore(textOf(b), favFoods) - tasteScore(textOf(a), favFoods));
}

function findRecipe(query) {
  const q = query.trim().toLowerCase();
  if (q.length < 3) return null;
  // рецепт выдаём только для блюд, которые реально можно приготовить
  // из продуктов, заказанных через приложение
  const inDb = RECIPE_DB.find((r) => r.match.some((m) => q.includes(m) || m.includes(q)));
  if (inDb) return inDb;
  const home = HOME_RECIPES.find((r) => r.name.toLowerCase().includes(q) || q.includes(r.name.toLowerCase().split(" ")[0]));
  if (home) {
    return { name: home.name, kcal: home.kcal, p: home.p, f: home.f, c: home.c, time: home.time,
      ingredients: null, steps: home.recipe };
  }
  return null;
}

// Динамика веса и состава тела строится под цель пользователя
function buildBody(goal, points) {
  const start = 78;
  const dir = goal === "gain" ? 1 : goal === "keep" ? 0 : -1;
  const labels = ["Фев", "Мар", "Апр", "Май", "Июн", "Июл", "Авг", "Сен", "Окт", "Ноя", "Дек", "Янв"];
  const weight = [], muscle = [], fat = [];
  for (let i = 0; i < points; i++) {
    const t = i / Math.max(1, points - 1);
    const wob = Math.sin(i * 1.7) * 0.35;
    weight.push(+(start + dir * t * 6 + wob).toFixed(1));
    muscle.push(+(32 + t * (goal === "gain" ? 4.2 : 1.6)).toFixed(1));
    fat.push(+(22 - t * (goal === "lose" ? 5.5 : 2.2)).toFixed(1));
  }
  return { weight, muscle, fat, labels: labels.slice(-points) };
}
